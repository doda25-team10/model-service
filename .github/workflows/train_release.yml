name: Train and Release Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python - << 'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          EOF
          )
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output

      - name: Preprocess Data
        run: python src/text_preprocessing.py

      - name: Train Model
        run: python src/text_classification.py

      - name: Create GitHub Release and Upload Model Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG="v${VERSION}-model.${{ github.run_number }}"
          TITLE="Model v${VERSION} (Run ${{ github.run_number }})"
          NOTES="Automated model training release from Run #${{ github.run_number }}"

          gh release create "$TAG" \
            output/model.joblib \
            output/preprocessor.joblib \
            output/preprocessed_data.joblib \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
